name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download official public-domain BSB USFM
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://ebible.org/Scriptures/engbsb_usfm.zip" \
            --output /tmp/engbsb_usfm.zip

      - name: Generate clean offline BSB database
        run: |
          rm -f app/src/main/assets/bsb.sqlite
          rm -f app/src/main/assets/kjv.sqlite
          python3 scripts/generate_bsb_database.py \
            --input /tmp/engbsb_usfm.zip \
            --output app/src/main/assets/bsb.sqlite
          ls -lh app/src/main/assets/bsb.sqlite

      - name: Validate bundled Bible and project files
        run: python3 scripts/validate_project.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Joel-Minimal-Launcher-BSB-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
